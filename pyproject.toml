[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-reconstruction-demo"
version = "0.6.2"
description = "Model-driven closed-loop cluster task reconstruction demo"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
  # Declare a compatible protocol dependency instead of loading an old system copy.
  "websockets>=13,<16",
  "networkx>=3.4,<3.5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
